<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>mocker — configuración</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="header">
      <span class="header__brand">
        <img class="header__logo" src="icons/icon-32.png" alt="" />
        <span class="header__title">mocker</span>
      </span>
      <span class="header__side">
        <button class="button button--small" id="import-project">
          Importar proyecto
        </button>
        <span class="header__status" id="connection-status"></span>
        <label class="header__mocking" for="global-toggle">Mocking</label>
        <input
          type="checkbox"
          class="toggle"
          id="global-toggle"
          title="Enciende o apaga mocker por completo"
        />
      </span>
    </header>
    <main class="settings">
      <p class="banner banner--action" id="access-banner" hidden>
        <span id="access-banner-text"></span>
        <button class="button button--primary" id="access-banner-action"></button>
      </p>
      <div class="banner" id="validation-banner" hidden></div>
      <p class="banner" id="stale-banner" hidden>
        Los ficheros han cambiado mientras editabas — guarda tu cambio o
        recarga la página para ver la última versión.
      </p>
      <div class="scenario-cards" id="project-container"></div>
      <div class="section-header">
        <h2 class="section-header__title">Escenarios</h2>
        <button class="button button--primary" id="new-scenario">
          Nuevo escenario
        </button>
      </div>
      <div class="scenario-cards" id="scenario-list"></div>
      <p class="empty" id="empty-message" hidden></p>
    </main>
    <div class="snackbar" id="snackbar" hidden></div>
    <script src="options.js"></script>
  </body>
</html>
